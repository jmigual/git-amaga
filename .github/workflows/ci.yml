name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GnuPG (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-gnupg
      - name: Install git-crypt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y git-crypt
      - name: gpg version
        run: gpg --version
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
