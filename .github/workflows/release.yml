name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # publish and crates-io both need build, so a mismatch stops the whole release.
      - name: Check the tag matches the workspace version
        if: runner.os == 'Linux'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "git-amaga") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          fi
      - name: Install GnuPG (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-gnupg
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Name the binary after its target
        shell: bash
        run: cp "target/${{ matrix.target }}/release/git-amaga${{ matrix.ext }}" "git-amaga-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-amaga-${{ matrix.target }}
          path: git-amaga-${{ matrix.target }}${{ matrix.ext }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # Tags like v1.2.0-rc.1 publish a pre-release, so they never become "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

  crates-io:
    needs: build
    # Tags like v1.2.0-rc.1 only publish a GitHub pre-release.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # If core uploads and the CLI then fails, a re-run fails on core with "already exists":
      # recover by hand with `cargo publish -p git-amaga --locked`.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
